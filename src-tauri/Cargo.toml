[package]
name = "ghostwhisper"
version = "0.2.0"
description = "Copiloto de reunião open-source, Linux-first e local-only"
authors = ["GhostWhisper"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ghostwhisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Classificador Laya (ONNX) — BR-098. O crate vive no submódulo `vendor/laya`
# (Apache-2.0) e não é publicado no crates.io. Sem a feature, o app compila só
# com o heurístico. Build: `git submodule update --init` + `cargo build --features laya`.
laya = ["dep:laya-onnx", "dep:ort"]
# Aceleração do Whisper por GPU (repassa para o `whisper-rs`). Por padrão o app é
# CPU; ligar GPU é o entregável E3 do PRD `precision-and-performance` (BR-029).
# A detecção de GPU (`ports::gpu_probe`) usa estas features em `cfg!` para saber
# se o build acelera.
#
# Linux sem ROCm/CUDA (ex.: AMD Polaris): use `vulkan` — é o caminho que o
# `whisper.cpp` suporta via Vulkan e funciona com o driver Mesa/RADV.
# Build: `scripts/vulkan-env.sh` monta o SDK e `pnpm tauri:dev:vulkan` compila.
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
hipblas = ["whisper-rs/hipblas"]
metal = ["whisper-rs/metal"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2.8.3"
base64 = "0.22"
# Classificador Laya — importado como `laya` (ver `[lib]` do crate).
# `default-features = false` desliga o download HTTP do SDK; o modelo é do
# model manager. O `ort` ainda baixa o binário do ONNX Runtime no build.
laya-onnx = { path = "../vendor/laya/laya-rust", optional = true, default-features = false }
# Pin do ONNX Runtime: o `laya-onnx` foi escrito contra o rc.13 e o resolver
# puxaria o rc.15 (API incompatível). Não é usado diretamente; só fixa a versão
# para a árvore da feature `laya`.
ort = { version = "=2.0.0-rc.13", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
libpulse-binding = "2"
libpulse-simple-binding = "2"
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
x11rb = { version = "0.13", features = ["shape", "randr"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
gdkx11 = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime = "2"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"

# Artefatos menores (o incremental chega a vários GB neste projeto).
[profile.dev]
incremental = false

# `whisper-rs-sys` compila whisper.cpp/ggml em C/C++. Sem otimização o ASR fica
# ~10x mais lento e o `tauri dev` parece travado (o `.deb`/AppImage usa release).
# Otimiza apenas esse pacote; o resto do app continua com build rápido.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
