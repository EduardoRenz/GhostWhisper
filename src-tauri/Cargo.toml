[package]
name = "ghostwhisper"
version = "0.1.0"
description = "Copiloto de reunião open-source, Linux-first e local-only"
authors = ["GhostWhisper"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ghostwhisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Aceleração do Whisper por GPU (repassa para o `whisper-rs`). Por padrão o app é
# CPU; ligar GPU é o entregável E3 do PRD `precision-and-performance` (BR-029).
# A detecção de GPU (`ports::gpu_probe`) usa estas features em `cfg!` para saber
# se o build acelera.
#
# Linux sem ROCm/CUDA (ex.: AMD Polaris): use `vulkan` — é o caminho que o
# `whisper.cpp` suporta via Vulkan e funciona com o driver Mesa/RADV.
# Build: `scripts/vulkan-env.sh` monta o SDK e `pnpm tauri:dev:vulkan` compila.
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]
hipblas = ["whisper-rs/hipblas"]
metal = ["whisper-rs/metal"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2.8.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
libpulse-binding = "2"
libpulse-simple-binding = "2"
whisper-rs = "0.16"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
x11rb = { version = "0.13", features = ["shape", "randr"] }
raw-window-handle = "0.6"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"

# Artefatos menores (o incremental chega a vários GB neste projeto).
[profile.dev]
incremental = false

# `whisper-rs-sys` compila whisper.cpp/ggml em C/C++. Sem otimização o ASR fica
# ~10x mais lento e o `tauri dev` parece travado (o `.deb`/AppImage usa release).
# Otimiza apenas esse pacote; o resto do app continua com build rápido.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
