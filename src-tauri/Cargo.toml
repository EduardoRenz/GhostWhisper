[package]
name = "ghostwhisper"
version = "0.1.0"
description = "Copiloto de reunião open-source, Linux-first e local-only"
authors = ["GhostWhisper"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ghostwhisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
libpulse-binding = "2"
libpulse-simple-binding = "2"
whisper-rs = "0.16"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.13", features = ["shape"] }
raw-window-handle = "0.6"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"

# Artefatos menores (o incremental chega a vários GB neste projeto).
[profile.dev]
incremental = false
